name: Deploy to dist branch

on:
  push:
    branches:
      - main

# 赋予 Actions 写入仓库的权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # 启用 npm 缓存加速

      # 3. 安装依赖 (关键：加上 --legacy-peer-deps 解决冲突)
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. 构建项目
      - name: Build project
        run: npm run build

      # 5. 部署到 dist 分支
      - name: Deploy to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist       # 你的构建输出目录
          destination_dir: .        # 推送到分支根目录
          keep_files: false         # 每次部署前清空旧文件
          branch: dist              # 目标分支
          commit_message: 'Deploy: ${{ github.sha }}'