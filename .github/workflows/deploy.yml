name: Deploy to dist branch

on:
  push:
    branches:
      - main

# 必须赋予写入权限，否则无法推送到 dist 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # 启用 pnpm 依赖缓存，加速构建

      # 3. 【核心修复】使用 npm 全局安装 pnpm
      # 这一步确保环境中一定有 pnpm 命令，解决 "Unable to locate executable file" 错误
      - name: Install PNPM
        run: npm install -g pnpm

      # 4. 安装项目依赖
      # --frozen-lockfile 确保严格匹配 pnpm-lock.yaml，保证构建一致性
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建项目
      - name: Build Project
        run: pnpm run build

      # 6. 部署到 dist 分支
      - name: Deploy to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist          # 构建输出目录
          destination_dir: .           # 部署到分支根目录
          keep_files: false            # 每次部署前清空旧文件
          branch: dist                 # 目标分支名
          commit_message: 'Deploy: ${{ github.sha }}'