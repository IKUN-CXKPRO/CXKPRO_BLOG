name: Deploy to dist branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      # 👇👇👇 【绝对不能少】这一步是专门用来安装 pnpm 软件的 👇👇👇
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          # 如果你本地是 pnpm 8，这里改成 8；如果不确定，写 'latest' 也可以

      # 3. 安装依赖 (现在环境里已经有 pnpm 命令了)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. 构建项目
      - name: Build project
        run: pnpm run build

      # 5. 部署到 dist 分支
      - name: Deploy to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: false
          branch: dist
          commit_message: 'Deploy: ${{ github.sha }}'