name: Deploy to dist branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js (注意：这里 cache 写 pnpm 只是为了优化，不会自动安装 pnpm)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm' 

      # 3. 显式安装 pnpm 工具
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建项目
      - name: Build project
        run: pnpm run build

      # 6. 部署到 dist 分支
      - name: Deploy to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: false
          branch: dist
          commit_message: 'Deploy: ${{ github.sha }}'