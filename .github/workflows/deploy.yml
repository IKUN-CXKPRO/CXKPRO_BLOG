name: Deploy to dist branch

on:
  push:
    branches:
      - main

permissions:
  contents: write # 允许推送代码到 dist 分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 和 pnpm
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 根据你的项目需求调整版本
          cache: 'pnpm'      # <--- 关键修改 1：启用 pnpm 缓存

      # 3. 安装 pnpm (如果 setup-node 没有自动安装最新稳定版，建议显式安装)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # 或者写 'latest'，建议锁定一个主版本号如 8 或 9

      # 4. 获取 pnpm store 目录路径并缓存 (可选，但推荐加速)
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 5. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile # <--- 关键修改 2：使用 pnpm install

      # 6. 构建项目
      - name: Build project
        run: pnpm run build                # <--- 关键修改 3：使用 pnpm run build

      # 7. 部署到 dist 分支
      - name: Deploy to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist              # 确保这里是你实际的构建输出目录
          destination_dir: .
          keep_files: false
          branch: dist
          commit_message: 'Deploy: ${{ github.sha }}'